
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YADAV AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08070c;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 500px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: radial-gradient(circle at 50% 20%, #24113e, transparent 40%), #08070c;
  overflow: hidden;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid #292233;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  overflow: hidden;
  background: #792ee0;
  box-shadow: 0 0 20px #a855f755;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand h1 {
  font-size: 17px;
  letter-spacing: 2px;
}

.brand p {
  color: #a99bb8;
  font-size: 11px;
  margin-top: 4px;
}

.new-chat {
  padding: 10px 12px;
  background: #17121f;
  border: 1px solid #39264e;
  color: #d7b8ff;
  border-radius: 12px;
}

.welcome {
  text-align: center;
  padding: 25px 12px 18px;
}

.orb {
  width: 130px;
  height: 130px;
  margin: 12px auto 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e5caff, #a855f7 20%, #6727c9 45%, #1a0a36 72%, #09070f);
  box-shadow: 0 0 25px #9b5cff80, 0 0 65px #6d28c755;
  animation: pulse 3s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.06); }
}

.welcome h2 {
  font-size: 24px;
  margin-bottom: 8px;
}

.welcome p {
  color: #a79bb7;
  font-size: 14px;
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px;
}

.suggestion {
  text-align: left;
  padding: 14px;
  border-radius: 16px;
  background: #14101d;
  border: 1px solid #292137;
  color: white;
}

.suggestion span {
  display: block;
  font-size: 20px;
  margin-bottom: 8px;
}

.suggestion strong {
  font-size: 13px;
}

.suggestion small {
  display: block;
  color: #92869f;
  margin-top: 5px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  padding: 13px 15px;
  border-radius: 17px;
  max-width: 85%;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #762de0, #5422aa);
  border-bottom-right-radius: 5px;
}

.bot {
  align-self: flex-start;
  background: #17131f;
  border: 1px solid #2b2438;
  border-bottom-left-radius: 5px;
}

.input-area {
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #0b0911;
}

.input-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #17121f;
  border: 1px solid #39264e;
  border-radius: 18px;
  padding: 8px 10px;
}

.input-box input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 10px 4px;
  font-size: 15px;
}

.input-box input::placeholder {
  color: #887c97;
}

.send {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 22px;
  background: linear-gradient(135deg, #a855f7, #6d28c9);
}

.footer {
  text-align: center;
  color: #665b75;
  font-size: 10px;
  padding-top: 9px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="logo">
      <img src="logo.png" alt="YADAV AI Logo">
    </div>
    <div>
      <h1>YADAV AI</h1>
      <p>Your AI Assistant</p>
    </div>
  </div>

  <button class="new-chat" onclick="newChat()">＋ New Chat</button>
</header>

<section class="welcome" id="welcome">
  <div class="orb"></div>
  <h2>How can I help you?</h2>
  <p>Ask anything. Create anything.</p>
</section>

<section class="suggestions" id="suggestions">
  <button class="suggestion" onclick="quick('Explain something to me')">
    <span>✦</span>
    <strong>Ask Anything</strong>
    <small>Get instant answers</small>
  </button>

  <button class="suggestion" onclick="quick('Help me write some code')">
    <span>⌘</span>
    <strong>Write Code</strong>
    <small>Programming help</small>
  </button>

  <button class="suggestion" onclick="quick('Help me study')">
    <span>▤</span>
    <strong>Study</strong>
    <small>Learn something new</small>
  </button>

  <button class="suggestion" onclick="quick('Give me creative ideas')">
    <span>✧</span>
    <strong>Creative Ideas</strong>
    <small>Explore creativity</small>
  </button>
</section>

<main class="chat" id="chat"></main>

<div class="input-area">
  <div class="input-box">
    <input id="message" type="text" placeholder="Message YADAV AI..." autocomplete="off">
    <button class="send" onclick="sendMessage()">↑</button>
  </div>
  <div class="footer">YADAV AI can make mistakes. Verify important information.</div>
</div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quick(text) {
  input.value = text;
  sendMessage();
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("suggestions").classList.add("hidden");

  addMessage(text, "user");
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.textContent = "YADAV AI is thinking...";
  chat.appendChild(typing);

  setTimeout(() => {
    typing.remove();
    addMessage(
      "Demo mode active! YADAV AI ka real AI connection abhi setup nahi hua hai. Backend connect hone ke baad AI reply dega.",
      "bot"
    );
  }, 900);
}

function newChat() {
  chat.innerHTML = "";
  input.value = "";
  document.getElementById("welcome").classList.remove("hidden");
  document.getElementById("suggestions").classList.remove("hidden");
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
